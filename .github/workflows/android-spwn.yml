name: Build SPWN for Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/spwn_source/**"
      - ".github/workflows/android-spwn.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: arm64-v8a
            target: aarch64-linux-android

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: android-actions/setup-android@v3

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Generate lockfile
        working-directory: app/spwn_source
        run: cargo generate-lockfile

      - name: Compile SPWN
        working-directory: app/spwn_source
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            cargo ndk -t "${{ matrix.abi }}" build \
              --release -p spwn --bin spwn && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done

      - name: Prepare artifact
        run: |
          mkdir -p "dist/${{ matrix.abi }}"
          cp "app/spwn_source/target/${{ matrix.target }}/release/spwn" \
            "dist/${{ matrix.abi }}/spwn"
          file "dist/${{ matrix.abi }}/spwn"

      - uses: actions/upload-artifact@v4
        with:
          name: spwn-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/spwn
          if-no-files-found: error
