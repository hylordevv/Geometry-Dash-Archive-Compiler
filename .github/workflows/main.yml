name: Build GD Archive Compiler APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      # 1) Compilador SPWN original (Rust) para Android arm64 -> libspwn.so
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: cargo install cargo-ndk
      - name: Build SPWN original
        continue-on-error: true
        run: |
          git clone https://github.com/Spu7Nix/SPWN-language spwn-src
          cd spwn-src
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$(ls $ANDROID_SDK_ROOT/ndk | head -n1)
          cargo ndk -t arm64-v8a build --release
          cp target/aarch64-linux-android/release/spwn ../app/src/main/jniLibs/arm64-v8a/libspwn.so
          [ -d libraries ] && cp -r libraries/. ../app/src/main/assets/spwn_libraries/ || true
      # 2) APK
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: GeometryDashArchiveCompiler-apk, path: app/build/outputs/apk/debug/*.apk }
